[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabletop"
version = "0.2.0"
description = "Generate incident-response tabletop exercises from your own system model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
tabletop = "tabletop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabletop = ["catalog.json", "facilitator.html"]
